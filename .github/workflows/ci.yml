name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Check formatting
        run: corepack pnpm format:check

      - name: Lint
        run: corepack pnpm lint

      - name: Check types
        run: corepack pnpm typecheck

      - name: Run unit tests
        run: corepack pnpm test

      - name: Build
        run: corepack pnpm build

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          # This CI-only bootstrap role owns the disposable database and test-created schemas.
          POSTGRES_USER: weft_test
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: weft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U weft_test -d weft_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_HOST: 127.0.0.1
      TEST_DATABASE_PORT: "5432"
      TEST_DATABASE_NAME: weft_test
      TEST_DATABASE_USER: weft_test
      TEST_DATABASE_PASSWORD: ci-only-test-password
      TEST_DATABASE_SSL: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Run integration tests
        run: corepack pnpm test:integration
